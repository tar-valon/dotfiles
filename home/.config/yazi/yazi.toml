# yazi.toml
[mgr]
show_hidden = true
sort_by = "mtime"
sort_reverse = true
sort_dir_first = false


[preview]
wrap = "yes"

[tasks]
image_bound      = [ 50000, 50000 ]

[opener]
play = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
]
image = [
	{ run = 'imv %s .', orphan = true, for = "unix" },
]
edit = [
	{ run = 'helix "%s"', block = true, orphan = true, desc = "Helix", for = "unix" },
]
office = [
	{ run = 'libreoffice %s', orphan = true, for = "unix" },
]
pdf = [
	{ run = '$HOME/.local/bin/sioyek %s', orphan = true, for = "unix" },
]
open = [
	{ run = 'xdg-open %s', desc = "Open" },
]
extract = [
	{ run = '7z x %s', desc = "Extract here" },
]

[open]
rules = [
	# Video
	{ mime = "video/*", use = "play" },

	# Images
	{ mime = "image/*", use = ["image", "open"] },

	# PDFs
	{ mime = "application/pdf", use = ["pdf", "open"] },

	# Office documents (Word, Excel, PowerPoint, OpenDocument)
	{ url = "*.doc", use = "office" },
	{ url = "*.docx", use = "office" },
	{ url = "*.xls", use = "office" },
	{ url = "*.xlsx", use = "office" },
	{ url = "*.ppt", use = "office" },
	{ url = "*.pptx", use = "office" },
	{ url = "*.odt", use = "office" },
	{ url = "*.ods", use = "office" },
	{ url = "*.odp", use = "office" },
	{ url = "*.rtf", use = "office" },

	# Archives
	{ mime = "application/zip", use = "extract" },
	{ mime = "application/x-tar", use = "extract" },
	{ mime = "application/x-7z-compressed", use = "extract" },
	{ mime = "application/x-rar", use = "extract" },
	{ mime = "application/gzip", use = "extract" },

	# Everything editable as text (source code, configs, markdown, etc.)
	{ mime = "inode/empty", use = "edit" },
	{ mime = "application/empty", use = "edit" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/toml", use = "edit" },
	{ mime = "application/x-yaml", use = "edit" },
	{ mime = "application/xml", use = "edit" },
	{ url = "*.conf", use = "edit" },
	{ url = "*.cfg", use = "edit" },
	{ url = "*.ini", use = "edit" },

	# Fallback
	{ url = "*", use = ["open", "edit"] },
]
